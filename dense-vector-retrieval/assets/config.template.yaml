# Copy this file. Fill every field. Do not delete keys.
# Run: python scripts/run_pipeline.py --config this.yaml --work-dir ./runs/exp1 --stage all

task:
  mode: reproduce          # reproduce | apply
  notes: ""

paper:
  title: ""
  table: ""                # e.g. "Table 3, row BGE-base, NFCorpus"
  claimed_metrics:
    nDCG@10: null          # number or null if unknown
    # MRR@10: null
    # Hit@20: null
    # Recall@100: null
  tolerance:
    ranking: 0.01          # nDCG / MAP / MRR absolute
    set: 0.02              # Recall / Hit absolute

data:
  benchmark: beir          # beir | mteb | msmarco | nq | custom
  dataset: nfcorpus
  split: test
  # Official BEIR folder (corpus.jsonl, queries.jsonl, qrels/*.tsv) or custom files:
  corpus_path: ""
  queries_path: ""
  qrels_path: ""
  title_mode: concat_space # concat_space | dpr_sep | text_only
  symmetric: false         # true for Quora-style duplicate retrieval

encode:
  architecture: auto       # auto | dpr | bi_encoder
  model_name_or_path: BAAI/bge-base-en-v1.5
  query_model: ""          # required for dpr / bi_encoder
  doc_model: ""
  pooling: cls             # cls | cls_pooler | mean | eos
  normalize: true
  score: cos_sim           # ip | cos_sim
  query_max_length: 512
  doc_max_length: 512
  query_prefix: "Represent this sentence for searching relevant passages: "
  passage_prefix: ""
  append_eos: false
  padding_side: right      # right | left  (left for many decoder-only eos models)
  batch_size: 64
  dtype: fp32              # fp32 | fp16 | bf16
  paper_override: false    # true only if paper/official script disagrees with family table

index:
  type: flat               # flat required for reproduce
  metric: ip               # ip (use for both ip and cosine-on-normalized vectors)

eval:
  k_values: [1, 3, 5, 10, 20, 100, 1000]
  primary: nDCG@10
  ignore_identical_ids: false
